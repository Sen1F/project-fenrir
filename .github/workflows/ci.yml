name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Markdown lint (always runs, no secrets required) ─────────────────────────
  lint-docs:
    name: Lint docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g markdownlint-cli
      - run: markdownlint "**/*.md" --ignore node_modules

  # ── Unity build + EditMode tests ─────────────────────────────────────────────
  #
  # Requires three GitHub secrets (Settings → Secrets → Actions):
  #   UNITY_LICENSE   — contents of your Unity_v6.x.alf license file
  #   UNITY_EMAIL     — Unity account email
  #   UNITY_PASSWORD  — Unity account password
  #
  # When secrets are not configured the job emits a notice and exits 0
  # so the PR is not blocked. Set the secrets to enable full CI.
  # ─────────────────────────────────────────────────────────────────────────────
  unity-build:
    name: Unity build & tests (Unity 6 LTS)
    runs-on: ubuntu-latest
    needs: lint-docs

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # ── Gate: skip remaining steps when license is not configured ─────────────
      - name: Check Unity license secret
        id: license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Unity CI skipped::Add UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD secrets to enable the Unity build. See docs/CI.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Cache (only useful when license is configured) ────────────────────────
      - name: Cache Unity Library
        if: steps.license.outputs.configured == 'true'
        uses: actions/cache@v4
        with:
          path: src/ProjectFenrir/Library
          key: ${{ runner.os }}-unity-${{ hashFiles('src/ProjectFenrir/Packages/packages-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-unity-

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Activate & build (iOS)
        if: steps.license.outputs.configured == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath:    src/ProjectFenrir
          unityVersion:   6000.4.9f1
          targetPlatform: iOS
          buildName:      ProjectFenrir
          buildsPath:     build

      # ── EditMode tests ────────────────────────────────────────────────────────
      - name: Run EditMode tests
        if: steps.license.outputs.configured == 'true'
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath:    src/ProjectFenrir
          unityVersion:   6000.4.9f1
          testMode:       editmode
          artifactsPath:  test-results

      - name: Upload test results
        if: steps.license.outputs.configured == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name:           test-results
          path:           test-results
          retention-days: 14

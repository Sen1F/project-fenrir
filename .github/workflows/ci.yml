name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Markdown lint (always runs) ───────────────────────────────────────────────
  lint-docs:
    name: Lint docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g markdownlint-cli
      - run: markdownlint "**/*.md" --ignore node_modules

  # ── Unity build + EditMode tests ─────────────────────────────────────────────
  #
  # NOTE: Unity 6 Personal licenses no longer support automated activation.
  # Unity dropped the .ulf manual activation and Hub OAuth cannot be scripted.
  # Unity build + tests run locally via Window → General → Test Runner → EditMode.
  #
  # To re-enable this job in future (Unity Pro serial or Unity Build Automation):
  #   1. Obtain a Unity Pro serial or configure Unity Build Automation
  #   2. Add UNITY_LICENSE / UNITY_EMAIL / UNITY_PASSWORD secrets
  #   3. Uncomment the unity-build job below
  # ─────────────────────────────────────────────────────────────────────────────
